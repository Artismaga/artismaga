[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.93"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
artismaga-localisation = { path = "crates/localisation" }
artismaga-core = { path = "crates/core" }
artismaga-config = { path = "crates/config" }
artismaga-db = { path = "crates/db" }
artismaga-auth = { path = "crates/auth" }
artismaga-render = { path = "crates/render" }
artismaga-web = { path = "crates/web" }
artismaga-setup = { path = "crates/setup" }
artismaga-accounts = { path = "crates/accounts" }
artismaga-administration = { path = "crates/administration" }
artismaga-storage = { path = "crates/storage" }
artismaga-studio = { path = "crates/studio" }
anyhow = "1"
argon2 = "0.5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
url = "2"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "ring", "webpki-roots"] }

# Atomic private configuration writes and constant-time setup credential comparison.
tempfile = "3"
subtle = "2"

object_store = { version = "0.13.2", features = ["aws", "tls-webpki-roots"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
